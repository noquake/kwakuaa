services:
  kwakuaa:
    image: kwaagyei/kwakuaa:2026.06.1
    container_name: kwakuaa
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data        # persists Caddy's TLS certs across restarts
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: