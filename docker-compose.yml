services:
  kwakuaa:
    build: .
    container_name: kwakuaa
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS}
    volumes:
      - caddy_data:/data        # persists Caddy's TLS certs across restarts
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: